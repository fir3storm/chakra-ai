[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chakra-ai"
version = "0.1.0"
description = "Chakra AI - Agentic Coding Terminal with Multi-Engine Kimi K3 Support"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Abhirup Guha (Info Security Solution)" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.22.0",
]

[project.scripts]
chakra = "chakra.cli:main"

[project.urls]
Homepage = "https://github.com/fir3storm/chakra-ai"
Repository = "https://github.com/fir3storm/chakra-ai.git"
