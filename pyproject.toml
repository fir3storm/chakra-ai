[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chakra-ai"
version = "0.1.0"
description = "Chakra-AI / KimiPy Engine: Windows 8GB RAM Lossless Streaming MoE Engine for Kimi K3 by Abhirup Guha (Info Security Solution)"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Abhirup Guha (Info Security Solution)", email = "abhirupguha@infosecuritysolution.com" }
]
maintainers = [
    { name = "Info Security Solution" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.22.0",
    "psutil>=5.8.0"
]

[project.urls]
Homepage = "https://github.com/InfoSecuritySolution/KimiWin-Py"
Repository = "https://github.com/InfoSecuritySolution/KimiWin-Py.git"
